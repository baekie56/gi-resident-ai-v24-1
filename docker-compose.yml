services:
  gi-resident-ai:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      GI24_ADMIN_USERNAME: ${GI24_ADMIN_USERNAME}
      GI24_ADMIN_PASSWORD: ${GI24_ADMIN_PASSWORD}
      GI24_REGISTRATION_CODE: ${GI24_REGISTRATION_CODE}
      GI24_SECURE_COOKIES: ${GI24_SECURE_COOKIES:-0}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
      GI24_SMS_SIGN_NAME: ${GI24_SMS_SIGN_NAME:-}
      GI24_SMS_TEMPLATE_CODE: ${GI24_SMS_TEMPLATE_CODE:-}
    volumes:
      - gi-resident-data:/data

volumes:
  gi-resident-data:
